  const decl=23.44*Math.sin(rad2*(360/365)*(day-81))*rad2;
  const eqt=9.87*Math.sin(2*rad2*(360/364)*(day-81))-7.53*Math.cos(rad2*(360/364)*(day-81))-1.5*Math.sin(rad2*(360/364)*(day-81));
  const utcH=d.getUTCHours()+d.getUTCMinutes()/60;

  const ha=(solarH-12)*15*rad2;
  const alt=Math.asin(Math.sin(lat*rad2)*Math.sin(decl)+Math.cos(lat*rad2)*Math.cos(decl)*Math.cos(ha));
  return alt<-0.5*rad2;
}

function fitPts(pts){
  if(pts.length<2)return;
  let w=1e9,s=1e9,e=-1e9,n=-1e9;
  pts.forEach(p=>{w=Math.min(w,p[1]);e=Math.max(e,p[1]);s=Math.min(s,p[0]);n=Math.max(n,p[0]);});
  if(![w,s,e,n].every(isFinite))return;
  let pad=isWide()?{top:70,bottom:70,left:450,right:90}:{top:$('top').offsetHeight+30,bottom:$('bottom').offsetHeight+30,left:40,right:40};
  const cv=map.getContainer(),H=cv.clientHeight,W=cv.clientWidth;
  if(H<140||W<140)return;
  const fit=(a,b,tot)=>{const room=Math.max(0,tot-100);if(pad[a]+pad[b]>room){const k=room/Math.max(1,pad[a]+pad[b]);pad[a]=Math.max(0,Math.floor(pad[a]*k));pad[b]=Math.max(0,Math.floor(pad[b]*k));}};
  fit('top','bottom',H);fit('left','right',W);
  if(e-w<1e-5&&n-s<1e-5){try{map.easeTo({center:[w,s],zoom:16,duration:500});}catch(x){}return;}
  try{map.fitBounds([[w,s],[e,n]],{padding:pad,maxZoom:17,duration:700,pitch:0,bearing:0});}
  catch(x){try{map.easeTo({center:[(w+e)/2,(s+n)/2],duration:500});}catch(y){}}
}

function safetyCheck(dNext){

function boardHint(){

    if(leg.warn&&leg.warn.length)x+=' '+t('lift_warn',{r:leg.warn[0]});
    const c=leg.coords,all=leg.exits||[],nl=all.filter(e=>!e.lift),ex=S.access?all.filter(e=>e.lift):(nl.length?nl:all);
    if(!leg.plats||!leg.plats.length||!ex.length||!c||c.length<2)return x;
    let k=0,bd=1e9;c.forEach((q,i)=>{const d=hav(q,leg.to.ll);if(d<bd){bd=d;k=i;}});
    let a=k;while(a>0&&hav(c[a],c[k])<40)a--;if(a===k)return x;
    const dir=bearing(c[a],c[k]);
    let pl=leg.plats;const g=String(leg.arrPlat||'').replace(/\D/g,'');
    if(g){const m=pl.filter(p=>String(p.ref).split(/[;,\/ ]+/).map(z=>z.replace(/\D/g,'')).includes(g));if(m.length)pl=m;}
    let best=null,b2=1e9;pl.forEach(p=>{const ct=centroid(p.pts),d=hav(c[k],ct);if(d<b2){b2=d;best=p;}});
    if(!best)return x;

    const half=Math.max(30,...best.pts.map(q=>Math.abs(along(q))));

async function trReadyCheck(leg,force){
  if(!force&&Date.now()-(TR.rdT||0)<20000)return false;
  TR.rdT=Date.now();
  const origin=leg.tripFrom&&normTxt(stName(leg.tripFrom))===normTxt(stName(leg.from.name));
  if(!leg.tripId||TR.j.source!=='VBB')return !!(origin&&+leg.dep-Date.now()<8*60000);
  try{
    const c=new AbortController(),tm=setTimeout(()=>c.abort(),6000);
    const d=await (await fetch('https://v6.vbb.transport.rest/trips/'+encodeURIComponent(leg.tripId)+'?stopovers=true&polyline=false&remarks=false',{signal:c.signal})).json();
    clearTimeout(tm);
    const tr=d.trip||d,so=tr.stopovers||[],me=so.find(x=>x.stop&&x.stop.name===leg.from.name);
    if(me){if(me.departurePlatform)leg.depPlat=me.departurePlatform;if(me.departure)leg.dep=new Date(me.departure);}
    const atOrigin=so[0]&&so[0].stop&&so[0].stop.name===leg.from.name;
    const cl=tr.currentLocation;let near=false;
    if(cl&&cl.latitude!=null&&leg.from.ll)near=hav([cl.latitude,cl.longitude],leg.from.ll)<180;
    return near||(atOrigin&&+leg.dep-Date.now()<8*60000);
  }catch(e){return false;}
}

}

function sunPos(lat,lng,d){

  const alt=Math.asin(Math.sin(la)*Math.sin(decl)+Math.cos(la)*Math.cos(decl)*Math.cos(ha));
  const az=Math.atan2(Math.sin(ha),Math.cos(ha)*Math.sin(la)-Math.tan(decl)*Math.cos(la));
  return {alt:alt/r,az:normA(az/r+180)};
}

function xferSay(){
  const L=TR.j.legs,leg=L[TR.li],ni=nextRideIdx();if(ni<0)return;
  const nr=L[ni],w=L.slice(TR.li+1,ni).filter(x=>x.walking).reduce((a,x)=>a+(x.arr-x.dep),0)/60000;
  const f=Math.max(0,Math.round((nr.dep-leg.arr)/60000)),wm=Math.max(1,Math.round(w||2));
  let x;
  if(leg.arrPlat&&nr.depPlat&&stName(leg.to.name)===stName(nr.from.name)&&leg.arrPlat===nr.depPlat)x=t('xf_same',{f});
  else if(leg.arrPlat&&nr.depPlat)x=t('xf_say',{a:leg.arrPlat,b:nr.depPlat,w:wm,f});
  else x=t('xf_noplat',{w:wm,f});
  if(f-wm<=2)x+=t('xf_tight');
  annOn('xfer')&&trSay(x);toast(x,8000);
}

function rSample(c){const out=[];let acc=0;for(let i=1;i<c.length;i++){acc+=hav(c[i-1],c[i]);if(acc>=60||i===c.length-1){out.push(c[i]);acc=0;}}return out;}
function rOverlap(a,b){const sa=rSample(a.coords);if(!sa.length)return 1;let hit=0;sa.forEach(p=>{let bd=1e9;for(let i=0;i<b.coords.length;i+=2){const d=hav(p,b.coords[i]);if(d<bd)bd=d;if(bd<30)break;}if(bd<30)hit++;});return hit/sa.length;}
async function moreRoutes(out,srv,prof,from,to){
  const D=hav(from,to);if(D<600||D>400000)return out;
  const mid=[(from[0]+to[0])/2,(from[1]+to[1])/2],br=bearing(from,to),best=Math.min(...out.map(r=>r.duration));
  const offs=[0.2,-0.2].map(k=>offPt(mid,normA(br+90),D*k));
  const res=await Promise.all(offs.map(v=>fetch('https://routing.openstreetmap.de/'+srv+'/route/v1/'+prof+'/'+from[1]+','+from[0]+';'+v[1]+','+v[0]+';'+to[1]+','+to[0]+'?overview=full&geometries=geojson&steps=true&continue_straight=false').then(r=>r.json()).catch(()=>null)));
  res.forEach(d=>{if(!d||d.code!=='Ok'||!d.routes||!d.routes[0])return;const r=mkRoute(d.routes[0]);
    // drop the "arrive at via point" step so it navigates like a normal route
    r.raw=r.raw.filter(st=>!(st.maneuver&&st.maneuver.type==='waypoint'));
    if(r.duration>best*1.45||r.duration-best>1800)return;
    if(out.some(o=>rOverlap(r,o)>0.82&&rOverlap(o,r)>0.82))return;
    // reject detours that double back (via point just "touched")
    if(r.distance>Math.min(...out.map(o=>o.distance))*1.6)return;
    out.push(r);});
  return out.sort((a,b)=>a.duration-b.duration).slice(0,5);
}
function routeVia(r){
  let best=null,bd=0;(r.raw||[]).forEach(st=>{const n=(st.ref||'').split(';')[0]||st.name;if(n&&st.distance>bd){bd=st.distance;best=n;}});return best;
}

let offBounds=null,offWide=false,offDetail=2,offBusy=false,offAbort=null,offCacheName=null;
const DETAIL_Z={1:13,2:15,3:17};
function lon2x(lon,z){return Math.floor((lon+180)/360*Math.pow(2,z));}
function lat2y(lat,z){const l=Math.max(-85,Math.min(85,lat))*Math.PI/180;return Math.floor((1-Math.log(Math.tan(l)+1/Math.cos(l))/Math.PI)/2*Math.pow(2,z));}
function styleKey(){return S.basemap==='sat'?'sat':(theme==='dark'?'dark':'light');}
function styleLabel(k){
  k=k||styleKey();
  return k==='sat'?t('bm_sat'):t('bm_std')+' · '+(k==='dark'?t('th_dark'):t('th_light'));
}
function regionBounds(){
  const b=offBounds;
  if(!offWide)return b;
  const dx=(b.e-b.w)*0.3,dy=(b.n-b.s)*0.3;
  return {w:b.w-dx,e:b.e+dx,s:b.s-dy,n:b.n+dy};
}
function collectSources(){
  const out=[];
  try{
    const st=map.getStyle();
    Object.keys(st.sources).forEach(id=>{
      const sd=st.sources[id];
      if(sd.type!=='vector'&&sd.type!=='raster')return;
      const src=map.getSource(id);
      const tpl=(src&&src.tiles&&src.tiles[0])||(sd.tiles&&sd.tiles[0]);
      if(!tpl||tpl.indexOf('{z}')<0||tpl.indexOf('{x}')<0||tpl.indexOf('{y}')<0)return;
      out.push({id,tpl,min:sd.minzoom!=null?sd.minzoom:((src&&src.minzoom)||0),max:sd.maxzoom!=null?sd.maxzoom:((src&&src.maxzoom)||14),type:sd.type});
    });
  }catch(e){}
  return out;
}
function planFor(b,maxZ){
  const urls=[];let est=0;
  collectSources().forEach(s=>{
    const top=Math.min(maxZ,s.max);
    for(let z=Math.max(4,s.min);z<=top;z++){
      const x0=lon2x(b.w,z),x1=lon2x(b.e,z),y0=lat2y(b.n,z),y1=lat2y(b.s,z);
      const n=(x1-x0+1)*(y1-y0+1);
      if(urls.length+n>20000)return;
      for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){
        urls.push(s.tpl.split('{z}').join(z).split('{x}').join(x).split('{y}').join(y));
        est+=s.type==='raster'?42000:90000;
      }
    }
  });
  return {urls,est};
}
function extraUrls(){
  const urls=[];
  try{
    const st=map.getStyle(),raw=styleFor();
    if(typeof raw==='string')urls.push(raw);
    Object.keys(st.sources).forEach(id=>{const sd=st.sources[id];if(typeof sd.url==='string')urls.push(sd.url);});
    if(typeof st.sprite==='string')['.json','.png','@2x.json','@2x.png'].forEach(x=>urls.push(st.sprite+x));
    if(st.glyphs){
      const stacks=new Set();
      const walk=v=>{
        if(Array.isArray(v)){
          if(v.length&&v.every(x=>typeof x==='string'&&/[A-Z]/.test(x)))stacks.add(v.join(','));
          else v.forEach(walk);
        }else if(v&&typeof v==='object')Object.keys(v).forEach(k=>walk(v[k]));
      };
      st.layers.forEach(l=>{if(l.layout&&l.layout['text-font'])walk(l.layout['text-font']);});
      ['0-255','256-511','1024-1279','8192-8447'].forEach(r=>stacks.forEach(fs=>urls.push(st.glyphs.replace('{fontstack}',fs).replace('{range}',r))));
    }
  }catch(e){}
  return urls;
}
function getRegions(){return lsGet('aether_offline',[]);}
function updateProg(done,total,bytes){
  $('off-bar').style.width=Math.round(done/total*100)+'%';
  $('off-ptxt').textContent=t('off_progress',{d:done,n:total,mb:(bytes/1048576).toFixed(1)});
}
async function downloadRegion(){
  if(offBusy){if(offAbort)offAbort.abort();return;}
  if(!window.caches){toast(t('off_fail'));return;}
  const b=regionBounds(),maxZ=DETAIL_Z[offDetail];
  const plan=planFor(b,maxZ);
  if(!plan.urls.length){toast(t('off_wait'));return;}
  if(plan.urls.length>8000){toast(t('off_big'));return;}
  const id=Date.now();
  const name=$('off-name').value.trim()||('Region '+(getRegions().length+1));
  const cname='aether-r-'+id;
  const key=styleKey();
  offBusy=true;offAbort=new AbortController();offCacheName=cname;
  $('off-prog').classList.remove('hidden');
  renderOffline();
  const cache=await caches.open(cname);
  const all=extraUrls().concat(plan.urls);
  let idx=0,done=0,bytes=0,fail=0;
  const total=all.length;
  updateProg(0,total,0);
  async function worker(){
    while(idx<all.length&&!offAbort.signal.aborted){
      const u=all[idx++];
      try{
        const r=await fetch(u,{signal:offAbort.signal});
        if(r.ok){
          const buf=await r.clone().arrayBuffer();
          bytes+=buf.byteLength;
          await cache.put(u,r);
        }else if(r.status!==404)fail++;
      }catch(e){if(e.name==='AbortError')return;fail++;}
      done++;
      if(done%4===0||done===total)updateProg(done,total,bytes);
    }
  }
  await Promise.all(Array.from({length:6},worker));
  const aborted=offAbort.signal.aborted;
  offBusy=false;offAbort=null;
  if(aborted){
    try{await caches.delete(cname);}catch(e){}
    $('off-prog').classList.add('hidden');
    renderOffline();
    return;
  }
  if(fail>total*0.2){
    try{await caches.delete(cname);}catch(e){}
    $('off-prog').classList.add('hidden');
    toast(t('off_fail'),4000);
    renderOffline();
    return;
  }
  const regs=getRegions();
  regs.push({id,name,key,b,maxZ,n:plan.urls.length,bytes,date:Date.now(),cache:cname});
  lsSet('aether_offline',regs);
  $('off-prog').classList.add('hidden');
  $('off-name').value='';
  toast(t('off_done',{n:name}),3500);
  renderOffline();
}
async function deleteRegion(id){
  const regs=getRegions(),r=regs.find(x=>x.id===id);
  if(r){try{await caches.delete(r.cache);}catch(e){}}
  lsSet('aether_offline',regs.filter(x=>x.id!==id));
  renderOffline();
}

  closeSettings();
  $('lp').classList.add('hidden');
  const b=map.getBounds();
  offBounds={w:b.getWest(),e:b.getEast(),s:b.getSouth(),n:b.getNorth()};

function closeOffline(){if(offBusy&&offAbort)offAbort.abort();$('off').classList.add('hidden');}
async function renderOffline(){
  if($('off-q')){$('off-q').textContent=t('offq_btn');$('off-q').classList.toggle('hidden',!acct());}
  pillRow($('off-area'),[[0,t('off_visible')],[1,t('off_wide')]],offWide?1:0,v=>{if(offBusy)return;offWide=!!v;renderOffline();});
  pillRow($('off-detail'),[[1,t('off_d1')],[2,t('off_d2')],[3,t('off_d3')]],offDetail,v=>{if(offBusy)return;offDetail=v;renderOffline();});
  $('off-style').textContent=styleLabel();
  const plan=offBusy?{urls:[],est:0}:planFor(regionBounds(),DETAIL_Z[offDetail]);
  if(!offBusy)$('off-est').textContent=plan.urls.length?('≈ '+Math.max(1,Math.round(plan.est/1048576))+' MB · '+plan.urls.length+' '+t('off_tiles')):t('off_wait');
  $('off-go').disabled=!offBusy&&!plan.urls.length;
  $('off-go').textContent=offBusy?t('off_cancel'):t('off_download');
  const list=$('off-list');list.innerHTML='';
  const regs=getRegions();
  if(!regs.length)list.innerHTML='<div class="text-sm t2 py-2">'+esc(t('off_none'))+'</div>';
  regs.forEach(r=>{
    const row=document.createElement('div');row.className='row';
    const info=document.createElement('div');info.className='flex-1 min-w-0 cursor-pointer';
    info.innerHTML='<div class="font-medium truncate">'+esc(r.name)+'</div><div class="text-xs t2">'+esc(styleLabel(r.key))+' · '+(r.bytes/1048576).toFixed(0)+' MB · '+new Date(r.date).toLocaleDateString(S.lang)+'</div>';
    info.onclick=()=>{closeOffline();map.fitBounds([[r.b.w,r.b.s],[r.b.e,r.b.n]],{padding:30,duration:800});};
    const del=document.createElement('button');del.className='btn btn-out px-3 py-2 text-sm';del.textContent='🗑';del.onclick=()=>deleteRegion(r.id);
    row.append(info,del);list.appendChild(row);
  });
  try{
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      $('off-store').textContent=t('off_storage',{u:Math.round((e.usage||0)/1048576),q:Math.round((e.quota||0)/1048576)});
    }
  }catch(e){}
}
$('off-go').onclick=downloadRegion;
{const qb=document.createElement('button');qb.id='off-q';qb.className='btn btn-out w-full py-3 mt-2 text-sm';$('off-go').after(qb);qb.onclick=()=>{const l=lsGet('aether_offq',[]);l.push({id:Date.now(),b:regionBounds(),d:offDetail,n:$('off-name').value.trim()||('Region '+(l.length+1))});lsSet('aether_offq',l.slice(-10));toast(t('offq_ok'),3000);};}
$('off-back').onclick=closeOffline;
$('set-offline').onclick=openOffline;
$('lp-off').onclick=openOffline;

function openSettings(){setMenuInit();$('set').classList.remove('hidden');renderSettings();setMain();}
function closeSettings(){$('set').classList.add('hidden');}
$('b-settings').onclick=openSettings;
$('b-ask').onclick=openAsk;
$('np-ask').onclick=()=>{$('np-menu').classList.add('hidden');updatePad();openAsk();};
$('np-set').onclick=openSettings;
$('np-set2').onclick=()=>{$('np-menu').classList.add('hidden');updatePad();openSettings();};
$('set-back').onclick=()=>{if(setPage)setMain();else closeSettings();};

function toggleRow(container,label,get,setf,disabled,rerender){
  const r=document.createElement('div');r.className='row';
  const l=document.createElement('div');l.className='flex-1 text-sm';l.textContent=label;
  const b=document.createElement('button');b.className='sw'+(get()?' on':'');
  if(disabled){r.style.opacity='.45';b.disabled=true;}
  b.onclick=()=>{setf(!get());saveS();(rerender||renderSettings)();};
  r.append(l,b);container.appendChild(r);
}
function pillRow(container,items,cur,onPick){
  container.innerHTML='';
  items.forEach(x=>{
    const b=document.createElement('button');
    b.className='chip flat px-4 py-2.5 text-sm'+(cur===x[0]?' act':'');
    b.textContent=x[1];b.onclick=()=>onPick(x[0]);
    container.appendChild(b);
  });
}
function applyTheme(){
  const nt=resolveTheme();
  document.documentElement.dataset.theme=nt;
  document.querySelector('meta[name=theme-color]').content=nt==='dark'?'#202124':'#ffffff';
  if(nt!==theme){
    theme=nt;
    if(S.basemap!=='sat')applyBasemap();
  }
}
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')applyTheme();});

function setLang(k){
  S.lang=k;S.voice='';saveS();
  ttsConfigure();
  applyI18N();
  setTimeout(fillVoices,700);
}
function fillEngines(){
  const sel0=$('set-engine'),wrap=$('set-engwrap');
  sel0.innerHTML='';
  let list=[];
  try{if(NAT())list=JSON.parse(NAT().getEngines());}catch(e){}
  if(!list.length){wrap.classList.add('hidden');return;}
  wrap.classList.remove('hidden');
  const d=document.createElement('option');d.value='';d.textContent=t('default_engine');sel0.appendChild(d);
  list.forEach(e=>{const o=document.createElement('option');o.value=e.name;o.textContent=e.label;sel0.appendChild(o);});
  sel0.value=S.engine||'';
}
function fillVoices(){
  const sv=$('set-voice');
  sv.innerHTML='';
  const a=document.createElement('option');a.value='';a.textContent=t('auto_voice');sv.appendChild(a);
  try{
    if(NAT()){
      const list=JSON.parse(NAT().getVoices(LANGS[S.lang].tts)).sort((x,y)=>(x.network-y.network)||(y.quality-x.quality));
      list.forEach((v,i)=>{const o=document.createElement('option');o.value=v.name;o.textContent=(i+1)+'. '+v.name+' · '+(v.network?t('online'):t('offline_v'));sv.appendChild(o);});
    }else{
      webVoices().forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name;sv.appendChild(o);});
    }
  }catch(e){}
  sv.value=S.voice||'';
  if(sv.value!==(S.voice||''))sv.value='';
}
function renderV19(){
  const pv=$('set-persona');if(pv)pillRow(pv,[['std',t('ps_std')],['buddy',t('ps_buddy')],['pilot',t('ps_pilot')]],S.persona||'std',v=>{S.persona=v;saveS();renderSettings();hushAll();speak(t('sp_route',{d:spDist(12400),t:spTime(1500)}),true,3);});
  const vv=$('set-v19voice');if(vv){vv.innerHTML='';toggleRow(vv,t('pan3d'),()=>S.pan3d!==false,v=>{S.pan3d=v;});const l=document.createElement('div');l.className='text-xs t2 mt-3 mb-1';l.textContent=t('duck_lbl');vv.appendChild(l);const pr=document.createElement('div');pr.className='flex gap-2';vv.appendChild(pr);pillRow(pr,[['low',t('duck_low')],['pause',t('duck_pause')]],S.duck||'low',v=>{S.duck=v;saveS();duckApply();renderSettings();});}
  const dv=$('set-v19disp');if(dv){dv.innerHTML='';toggleRow(dv,t('sig_on'),()=>S.sig!==false,v=>{S.sig=v;});toggleRow(dv,t('jz_on'),()=>S.jzoom!==false,v=>{S.jzoom=v;});toggleRow(dv,t('cin_on'),()=>S.cinema!==false,v=>{S.cinema=v;});}
  const sv=$('set-v19safe');if(sv){sv.innerHTML='';toggleRow(sv,t('ok_on'),()=>S.okCheck!==false,v=>{S.okCheck=v;},!S.contactPhone);toggleRow(sv,t('esc_on'),()=>!!S.escort,v=>{S.escort=v;},!S.contactPhone);}
  if($('sos-alarm'))$('sos-alarm').textContent=t('sos_alarm');
}
function renderSettings(){setTimeout(renderV19,0);
  pillRow($('set-langs'),Object.keys(LANGS).map(k=>[k,LANGS[k].name]),S.lang,setLang);
  pillRow($('set-units'),[['km',t('km')],['mi',t('mi')]],S.units,v=>{S.units=v;saveS();$('speedunit').textContent=v==='mi'?'MPH':'KM/H';renderSettings();if(navigating)renderNav();});
  pillRow($('set-theme'),[['auto',t('th_auto')],['light',t('th_light')],['dark',t('th_dark')]],S.theme,v=>{S.theme=v;saveS();applyTheme();renderSettings();});
  pillRow($('set-annstyle'),[['std',t('ann_std')],['detail',t('ann_det')]],S.annStyle,v=>{S.annStyle=v;saveS();renderSettings();});
  const sa=$('set-safety');sa.innerHTML='';
  toggleRow(sa,t('ann_on'),()=>!muted,v=>{if(muted===v)toggleMute();});
  toggleRow(sa,t('tr_hponly'),()=>S.trHeadOnly,v=>{S.trHeadOnly=v;});
  if(NAT()&&NAT().earStart)toggleRow(sa,t('tr_mic'),()=>S.trMic,v=>{S.trMic=v;if(!v)micOff();});
  toggleRow(sa,t('safety_master'),()=>S.safety.master,v=>{S.safety.master=v;});
  const off=!S.safety.master;
  toggleRow(sa,t('s_cross'),()=>S.safety.cross,v=>{S.safety.cross=v;},off);
  toggleRow(sa,t('s_hazard'),()=>S.safety.hazard,v=>{S.safety.hazard=v;},off);
  toggleRow(sa,t('s_speed'),()=>S.safety.speed,v=>{S.safety.speed=v;},off);
  toggleRow(sa,t('s_limit'),()=>S.safety.limit,v=>{S.safety.limit=v;},off);
  const di=$('set-display');di.innerHTML='';
  toggleRow(di,t('tilt3d'),()=>S.tilt,v=>{S.tilt=v;});
  toggleRow(di,t('haptic'),()=>S.haptic,v=>{S.haptic=v;if(v)haptic(60);});
  toggleRow(di,t('watch_alerts'),()=>S.watch,v=>{S.watch=v;});
  toggleRow(di,t('set_screen'),()=>S.screenOn,v=>{S.screenOn=v;if(navigating){natKeep(v);if(v)lockScreen();else unlockScreen();}});
  toggleRow(di,t('set_precache'),()=>S.precache,v=>{S.precache=v;});
  renderExtras();renderStats();renderRoutines();renderLearn();
  const em=$('set-emerg');em.innerHTML='';
  toggleRow(em,t('sw_toggle'),()=>S.safeWalk,v=>{S.safeWalk=v;});
  toggleRow(em,t('drive_lock'),()=>S.driveLock,v=>{S.driveLock=v;});
  $('set-cname').value=S.contactName||'';$('set-cphone').value=S.contactPhone||'';$('set-tt').value=S.ttKey||'';
  $('set-vol').value=S.vol;$('set-rate').value=S.rate;
  $('set-info').textContent=t('tts_info');
  $('set-install').style.display=NAT()?'':'none';
  $('set-demo').textContent=simTimer?t('demo_stop'):t('demo');
  fillEngines();fillVoices();
}
$('set-engine').onchange=e=>{
  S.engine=e.target.value;S.voice='';saveS();ttsConfigure();
  setTimeout(fillVoices,800);setTimeout(fillVoices,2000);
};
$('set-voice').onchange=e=>{
  S.voice=e.target.value;saveS();ttsConfigure();
  setTimeout(()=>speak(t('test_text'),true),500);
};
$('set-test').onclick=()=>speak(t('test_text'),true);
$('set-install').onclick=()=>{try{if(NAT())NAT().openSettings();}catch(e){}};
$('set-cname').oninput=e=>{S.contactName=e.target.value;saveS();};
$('set-cphone').oninput=e=>{S.contactPhone=e.target.value;saveS();};
$('set-tt').onchange=e=>{S.ttKey=e.target.value.trim();if(!S.ttKey)S.traffic=false;saveS();dropLayer('traffic');ensureOverlays();};
$('set-vol').oninput=e=>{S.vol=parseFloat(e.target.value);saveS();};
$('set-rate').oninput=e=>{S.rate=parseFloat(e.target.value);saveS();};
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{if(!$('set').classList.contains('hidden'))fillVoices();};

function applyI18N(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh);});
  $('np-demo').textContent=simTimer?t('demo_stop'):t('demo');
  $('speedunit').textContent=S.units==='mi'?'MPH':'KM/H';
  setMuteUI();
  renderCats();renderExplore();
  if(destLatLng){setRouteHeader();if(screen==='route')renderRoutePanel();}
  if(steps.length){steps=stepsOf({raw:steps.map(s=>s.rawStep)});buildStepList();if(navigating)renderNav();}
  if(!$('so').classList.contains('hidden')&&!$('q').value)renderRecents();
  if(!$('set').classList.contains('hidden'))renderSettings();
}

function handleBack(){
  if(!$('lp').classList.contains('hidden')){$('lp').classList.add('hidden');return true;}
  if(!$('off').classList.contains('hidden')){closeOffline();return true;}
  if(!$('ar').classList.contains('hidden')){closeAR();return true;}
  if(SC.on){scStop();return true;}
  if(!$('indoor').classList.contains('hidden')){closeIndoor();return true;}
  if(!$('scanv').classList.contains('hidden')){stopScan();return true;}
  if(!$('qrv').classList.contains('hidden')){$('qrv').classList.add('hidden');return true;}
  if(!$('genv').classList.contains('hidden')){genClose();return true;}
  if(!$('tplan').classList.contains('hidden')){$('tplan').classList.add('hidden');return true;}
  if(!$('more').classList.contains('hidden')){$('more').classList.add('hidden');return true;}
  if(setPage){setMain();return true;}
  if(!$('demov').classList.contains('hidden')){$('demov').classList.add('hidden');return true;}
  if(!$('learnv').classList.contains('hidden')){$('learnv').classList.add('hidden');return true;}
  if(!$('set').classList.contains('hidden')){closeSettings();return true;}
  if(!$('so').classList.contains('hidden')){closeSearch();return true;}
  if(screen==='nav'){toast(t('exit_hint'));return true;}
  if(screen==='route'){routeId++;clearRoutes();show('preview');return true;}
  if(screen==='preview'){closePreview();return true;}
  if(sheetH>200){setSheet(snaps()[0],true);return true;}
  return false;
}
history.replaceState({r:1},'');
history.pushState({s:1},'');
window.aetherBack=()=>{
  if(handleBack())return;
  const now=Date.now();
  if(now-lastBack<2000){try{if(NAT()){NAT().exitApp();return;}}catch(e){}}
  lastBack=now;toast(t('back_exit'),1800);
};
window.addEventListener('popstate',()=>{
  if(handleBack()){history.pushState({s:1},'');return;}
  const now=Date.now();
  if(now-lastBack<2000){
    try{if(NAT()){NAT().exitApp();return;}}catch(e){}
  }
  lastBack=now;
  toast(t('back_exit'),1800);
  history.pushState({s:1},'');
});

applyI18N();
setModeUI();
show('map');
updateParkMarker();
setInterval(()=>{if(S.theme==='sun')applyTheme();},300000);
setSheet(170,false);
ttsConfigure();
startWatch();
setTimeout(()=>{if(!gotFix)onErr();},9000);

if('serviceWorker' in navigator&&!window.Capacitor&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
window.addEventListener('load',()=>{
  setTimeout(()=>{
    $('splash').classList.add('out');
    setTimeout(()=>{$('splash').remove();map.resize();},700);
  },1800);
});
