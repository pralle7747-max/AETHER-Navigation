/* == OLED Navigation == */
:root {
  --bg:    #000000;
  --s1:    #0d0d0d;
  --s2:    #131313;
  --s3:    #1c1c1c;
  --ac:    #00A8FF;
  --acg:   rgba(0,168,255,.18);
  --fg:    #ffffff;
  --fg2:   rgba(255,255,255,.58);
  --fg3:   rgba(255,255,255,.28);
  --brd:   rgba(255,255,255,.07);
  --grn:   #00E676;
  --amb:   #FFB300;
  --red:   #FF3B5C;
  color-scheme: dark;
}

@keyframes pulse-blue {
  0%   { box-shadow: 0 0 0 0 rgba(0,168,255,.7); }
  70%  { box-shadow: 0 0 0 9px rgba(0,168,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(0,168,255,0); }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'Inter', system-ui, sans-serif; }

#map { position: fixed; inset: 0; z-index: 0; }
.leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }

/* ── TOP ── */
#top {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: 10px;
  background: linear-gradient(to bottom, rgba(0,0,0,.97) 60%, transparent 100%);
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.srow { display: flex; gap: 8px; align-items: center; }

#q {
  flex: 1; min-width: 0;
  background: var(--s2);
  color: var(--fg);
  border: 1px solid var(--brd);
  border-radius: 15px;
  padding: 13px 16px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color .15s;
}
#q::placeholder { color: var(--fg3); }
#q:focus { border-color: var(--ac); box-shadow: 0 0 0 1px var(--ac); }

.sqb {
  width: 48px; height: 48px; flex-shrink: 0;
  background: var(--s2);
  color: var(--fg2);
  border: 1px solid var(--brd);
  border-radius: 15px;
  cursor: pointer; font-size: 19px;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s;
}
.sqb:active { background: var(--s3); }

#drop {
  background: var(--s1);
  border: 1px solid var(--brd);
  border-radius: 14px;
  overflow: hidden;
}
#drop:empty { display: none; }
.di { padding: 11px 15px; cursor: pointer; border-bottom: 1px solid var(--brd); }
.di:last-child { border-bottom: none; }
.di:active { background: var(--s3); }
.dn { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds { font-size: 11px; color: var(--fg3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

/* ── TABS ── */
#tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

.tab {
  background: var(--s2);
  border: 1.5px solid var(--brd);
  border-radius: 15px;
  padding: 11px 6px 10px;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  transition: background .12s, border-color .12s;
  font-family: inherit;
  color: var(--fg2);
}
.tab-ic { font-size: 24px; line-height: 1; }
.tab-lb { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.tab.on {
  background: var(--acg);
  border-color: var(--ac);
  color: var(--ac);
}
#tab-train.on { border-color: var(--amb); color: var(--amb); background: rgba(255,179,0,.12); }

/* ── BOTTOM PANEL ── */
#bot {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 1000;
  background: var(--bg);
  border-top: 1px solid var(--brd);
  padding-top: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; flex-direction: column; gap: 12px;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
}
#bot.open { transform: translateY(0); }

/* Speed */
#spd-wrap {
  display: none;
  align-items: baseline; justify-content: center; gap: 6px;
  padding: 6px 0;
}
#spd-wrap.show { display: flex; }
#spd {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: 72px;
  color: var(--ac);
  line-height: 1;
  text-shadow: 0 0 24px rgba(0,168,255,.55), 0 0 48px rgba(0,168,255,.25);
  font-variant-numeric: tabular-nums;
  letter-spacing: -1px;
}
.spd-u {
  font-family: 'Orbitron', monospace;
  font-size: 17px; font-weight: 700;
  color: var(--fg2); letter-spacing: .12em;
  align-self: flex-end; margin-bottom: 10px;
}

/* Maneuver row */
#man {
  display: flex; align-items: center; gap: 13px;
}
#arrow {
  width: 58px; height: 58px; flex-shrink: 0;
  background: var(--acg);
  border: 1.5px solid var(--ac);
  border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  box-shadow: inset 0 0 12px rgba(0,168,255,.1);
}
#man-info { flex: 1; min-width: 0; }
#man-dist {
  font-size: 21px; font-weight: 700;
  color: var(--ac); font-variant-numeric: tabular-nums;
}
#man-street {
  font-size: 13px; color: var(--fg2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-top: 2px;
}
#rsums { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
#rdist { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
#rtime { font-size: 13px; color: var(--fg2); font-variant-numeric: tabular-nums; }

/* Start/Stop */
#ss {
  width: 100%; padding: 15px;
  background: var(--ac);
  color: #000; border: none;
  border-radius: 15px;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 15px; font-weight: 800;
  letter-spacing: .09em; text-transform: uppercase;
  cursor: pointer;
  transition: opacity .15s, background .15s;
  box-shadow: 0 0 20px rgba(0,168,255,.35);
}
#ss.stop { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,59,92,.35); }
#ss:active { opacity: .82; }
</style>

<div id="map"></div>

<div id="top">
  <div class="srow">
    <input id="q" type="search" autocomplete="off" placeholder="Ziel eingeben…">
    <button class="sqb" onclick="clearDest()" title="Löschen">✕</button>
    <button class="sqb" onclick="center()" title="Standort">◎</button>
  </div>
  <div id="drop"></div>
  <div id="tabs">
    <button class="tab on" id="tab-foot" data-m="foot" onclick="setMode('foot')">
      <span class="tab-ic">🚶</span><span class="tab-lb">Fuß</span>
    </button>
    <button class="tab" id="tab-train" data-m="train" onclick="setMode('train')">
      <span class="tab-ic">🚆</span><span class="tab-lb">Bahn</span>
    </button>
    <button class="tab" id="tab-car" data-m="car" onclick="setMode('car')">
      <span class="tab-ic">🚗</span><span class="tab-lb">Auto</span>
    </button>
  </div>
</div>

<div id="bot">
  <div id="spd-wrap">
    <span id="spd">0</span><span class="spd-u">km/h</span>
  </div>
  <div id="man">
    <div id="arrow">⬆</div>
    <div id="man-info">
      <div id="man-dist">– m</div>
      <div id="man-street">–</div>
    </div>
    <div id="rsums">
      <div id="rdist">–</div>
      <div id="rtime">–</div>
    </div>
  </div>
  <button id="ss" onclick="toggleNav()">▶ &nbsp;START</button>
</div>

<script>
const map = L.map('map', { zoomControl: false, attributionControl: false })
  .setView([48.137, 11.576], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd' }).addTo(map);

let mode = 'foot', userPos = null, userSpeed = 0;
let destPos = null, route = null, steps = [], curStep = 0, navOn = false;
let uMark = null, dMark = null, rLine = null;

const mkIco = (c, s, anim) => L.divIcon({
  html: `<div class="${anim ? 'pulse-mark' : ''}" style="width:${s}px;height:${s}px;border-radius:50%;background:${c};border:2.5px solid #fff;${anim ? 'animation:pulse-blue 2s infinite;' : ''}box-shadow:0 0 8px ${c}80;"></div>`,
  iconSize: [s, s], iconAnchor: [s / 2, s / 2], className: ''
});

navigator.geolocation.watchPosition(
  pos => {
    userPos = [pos.coords.latitude, pos.coords.longitude];
    userSpeed = pos.coords.speed != null ? pos.coords.speed * 3.6 : 0;
    if (!uMark) {
      uMark = L.marker(userPos, { icon: mkIco('#00A8FF', 16, true), zIndexOffset: 1000 }).addTo(map);
      map.setView(userPos, 15);
    } else uMark.setLatLng(userPos);
    if (mode === 'car') document.getElementById('spd').textContent = Math.round(userSpeed);
    if (navOn && steps.length) tick();
    if (navOn) map.setView(userPos, 17);
  },
  () => { if (!userPos) { userPos = [48.137, 11.576]; uMark = L.marker(userPos, { icon: mkIco('#FF3B5C', 14, false), zIndexOffset: 1000 }).addTo(map); } },
  { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 }
);

function center() { if (userPos) map.flyTo(userPos, 16, { duration: .7 }); }

function setMode(m) {
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.m === m));
  const sp = document.getElementById('spd-wrap');
  if (m === 'car' && document.getElementById('bot').classList.contains('open')) sp.classList.add('show');
  else sp.classList.remove('show');
  if (destPos) calcRoute();
}

let tmr;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(tmr);
  const v = e.target.value.trim();
  if (v.length < 3) { document.getElementById('drop').innerHTML = ''; return; }
  tmr = setTimeout(() => suggest(v), 400);
});
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const v = document.getElementById('q').value.trim(); if (v.length >= 2) suggest(v); }
});

function clearDest() {
  document.getElementById('q').value = '';
  document.getElementById('drop').innerHTML = '';
  if (dMark) { map.removeLayer(dMark); dMark = null; }
  if (rLine) { map.removeLayer(rLine); rLine = null; }
  destPos = null; route = null; steps = [];
  document.getElementById('bot').classList.remove('open');
  if (navOn) stopNav();
}

async function suggest(q) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5&accept-language=de`, { headers: { 'User-Agent': 'SamsungCamNav/2.0' } });
    const d = await r.json();
    document.getElementById('drop').innerHTML = d.map(x => {
      const p = x.display_name.split(', ');
      return `<div class="di" onclick="pick(${x.lat},${x.lon},\`${x.display_name.replace(/`/g,"'")}\`)"><div class="dn">${p[0]}</div>${p[1] ? `<div class="ds">${p.slice(1, 3).join(', ')}</div>` : ''}</div>`;
    }).join('');
  } catch {}
}

function pick(lat, lon, name) {
  destPos = [+lat, +lon];
  document.getElementById('q').value = name.split(', ')[0];
  document.getElementById('drop').innerHTML = '';
  if (dMark) map.removeLayer(dMark);
  dMark = L.marker(destPos, { icon: mkIco('#FF3B5C', 20, false) }).addTo(map);
  calcRoute();
}

const PROF  = { foot: 'foot', train: 'foot', car: 'car' };
const RCOL  = { foot: '#00A8FF', train: '#FFB300', car: '#00A8FF' };

async function calcRoute() {
  if (!userPos || !destPos) return;
  try {
    const url = `https://router.project-osrm.org/route/v1/${PROF[mode]}/${userPos[1]},${userPos[0]};${destPos[1]},${destPos[0]}?overview=full&geometries=geojson&steps=true`;
    const d = await (await fetch(url)).json();
    if (!d.routes?.[0]) return;
    route = d.routes[0];
    if (rLine) map.removeLayer(rLine);
    rLine = L.geoJSON(route.geometry, { style: { color: RCOL[mode], weight: 5, opacity: .9, lineJoin: 'round', lineCap: 'round' } }).addTo(map);
    map.fitBounds(rLine.getBounds(), { padding: [100, 100] });
    steps = route.legs[0].steps.map(s => ({
      pos: [s.maneuver.location[1], s.maneuver.location[0]],
      name: s.name || s.maneuver.type,
      dist: s.distance, dur: s.duration,
      type: s.maneuver.type, mod: s.maneuver.modifier || ''
    }));
    curStep = 0;
    setRSums(route.distance, route.duration);
    if (steps[0]) showStep(steps[0]);
    document.getElementById('bot').classList.add('open');
    if (mode === 'car') document.getElementById('spd-wrap').classList.add('show');
    else document.getElementById('spd-wrap').classList.remove('show');
  } catch (e) { console.error(e); }
}

function setRSums(dist, dur) {
  const km = (dist / 1000).toFixed(1);
  const min = Math.round(dur / 60);
  const h = Math.floor(min / 60), m = min % 60;
  document.getElementById('rdist').textContent = km + ' km';
  document.getElementById('rtime').textContent = h > 0 ? `${h}h ${m}min` : `${min} min`;
}

const ARROWS = {
  arrive: '🏁', depart: '⬆', roundabout: '🔄', rotary: '🔄', fork: '⬆',
  merge: '⬆', 'new name': '⬆', continue: '⬆', notification: 'ℹ'
};
function getArrow(type, mod) {
  if (ARROWS[type]) return ARROWS[type];
  if (mod.includes('uturn')) return '↩';
  if (mod.includes('sharp left'))  return '↰';
  if (mod.includes('sharp right')) return '↱';
  if (mod.includes('slight left'))  return '↖';
  if (mod.includes('slight right')) return '↗';
  if (mod.includes('left'))  return '←';
  if (mod.includes('right')) return '→';
  return '⬆';
}

function showStep(s) {
  document.getElementById('arrow').textContent = getArrow(s.type, s.mod);
  document.getElementById('man-street').textContent = s.name;
  document.getElementById('man-dist').textContent = s.dist >= 1000 ? `${(s.dist / 1000).toFixed(1)} km` : `${Math.round(s.dist)} m`;
}

function hvs([la1, lo1], [la2, lo2]) {
  const R = 6371000, r = Math.PI / 180;
  const dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function tick() {
  while (curStep < steps.length - 1 && hvs(userPos, steps[curStep].pos) < 30) curStep++;
  showStep(steps[curStep]);
  let rem = 0;
  for (let i = curStep; i < steps.length; i++) rem += steps[i].dist;
  const spd = mode === 'car' ? 50 : 5;
  setRSums(rem, (rem / 1000 / spd) * 3600);
}

function toggleNav() { navOn ? stopNav() : startNav(); }

function startNav() {
  if (!route || !userPos) return;
  navOn = true; curStep = 0;
  const btn = document.getElementById('ss');
  btn.textContent = '■  STOP';
  btn.classList.add('stop');
  if (userPos) map.setView(userPos, 17);
}

function stopNav() {
  navOn = false;
  const btn = document.getElementById('ss');
  btn.textContent = '▶  START';
  btn.classList.remove('stop');
  if (route) { setRSums(route.distance, route.duration); if (steps[0]) showStep(steps[0]); }
}
</script>
